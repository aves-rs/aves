name: Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/aves/**"
      - "crates/corv/**"
      - "crates/kea/**"
      - "crates/tyto/**"

permissions:
  contents: read

jobs:
  test-rs:
    if: github.event.pull_request.draft == false
    name: Rust Package Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: clippy,rustfmt
          cache: true
          cache-shared-key: aves-v1
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Lint packages
        run: |
          cargo fmt -- --check

      - name: Build packages
        run: |
          cargo check

      - name: Analyze packages
        run: |
          cargo clippy -- --deny warnings

      - name: Test packages
        run: |
          cargo test --package aves --no-default-features
          cargo test --workspace --exclude aves --no-default-features
