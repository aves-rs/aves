[package]
name = "aves"
version = "0.8.0"
repository = "https://github.com/aves-rs/aves"
description = "Typed async application runtime with domain messaging, RPC, and durable workflow automation"
authors = { workspace = true }
edition = { workspace = true }
keywords = ["async", "runtime", "actors", "rpc", "workflow"]
categories = ["asynchronous"]
readme = "../../README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "../../README.md", "src/**"]
rust-version = "1.97"
license = "Apache-2.0"

[lib]
name = "aves"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["keyring", "wasm-tests"]
# Runs tests that require an available desktop OS keyring; headless CI disables default features.
keyring = ["dep:zbus-secret-service-keyring-store"]
# Runs tests that execute the QuickJS-in-Wasmtime guest; headless CI disables default features.
wasm-tests = []
# Exposes test fixtures used by downstream crate test builds.
test-support = []

[build-dependencies]

[dev-dependencies]
keyring-core = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[dependencies]
# internal
aves_macros = { path = "macros", version = "=0.8.0" }

# external
arc-malachitebft-app-channel.workspace = true
arc-malachitebft-codec = { workspace = true }
arc-malachitebft-core-consensus = { workspace = true }
arc-malachitebft-core-types = { workspace = true }
arc-malachitebft-engine = { workspace = true }
arc-malachitebft-network = { workspace = true }
arc-malachitebft-signing = { workspace = true }
arc-malachitebft-sync = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bonsai-bt = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
gethostname = { workspace = true }
getrandom = { workspace = true }
hpke = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
oxc = { workspace = true }
pkcs8 = { workspace = true }
ractor = { workspace = true }
rand = { workspace = true }
rspc = { workspace = true }
rspc-axum = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde-big-array = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
turso = { workspace = true }
uuid = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }
