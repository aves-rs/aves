[package]
name = "aves-kea"
version = "0.5.8"
repository = "https://github.com/aves-rs/aves"
description = "Specialized knowledge domain for the Aves async application runtime"
authors = { workspace = true }
edition = { workspace = true }
keywords = ["async", "runtime", "actors", "rpc", "workflow"]
categories = ["asynchronous"]
readme = "README.md"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "src/**", "migrations/**"]
rust-version = "1.97"
license = "Apache-2.0"

[lib]
name = "kea"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]

[build-dependencies]

[dev-dependencies]
# internal
aves = { path = "../aves", version = "=0.5.8", features = ["test-support"] }

# external
tempfile = { workspace = true }

[dependencies]
# internal
aves = { path = "../aves", version = "=0.5.8" }

# external
chrono = { workspace = true }
rspc = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
turbovault-core = { workspace = true }
turbovault-parser = { workspace = true }
turbovault-tools = { workspace = true }
turbovault-vault = { workspace = true }
turso = { workspace = true }
uuid = { workspace = true }
